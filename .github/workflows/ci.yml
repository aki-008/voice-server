name: CI (Linux)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify-nemo-setup:
    runs-on: ubuntu-latest
    timeout-minutes: 45 # installer can be slow; default is 360 but be explicit

    env:
      NODE_ENV: development # keep isDev = true so no SPA static serving needed
      PORT: "3000"
      CI: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install JS dependencies
        run: npm ci

      # --- Optional: cache the NeMo vendor tree between runs -----------------
      # The installer is ~several minutes; caching vendor/ saves that on the
      # happy path. If the cache key misses, the installer runs again.
      - name: Cache NeMo vendor
        uses: actions/cache@v4
        with:
          path: vendor/NeMoSpeech
          key: nemo-${{ runner.os }}-${{ hashFiles('package.json') }}
          restore-keys: |
            nemo-${{ runner.os }}-

      # --- Linux-only tooling the installer expects --------------------------
      - name: Ensure installer prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            curl ca-certificates tar xz-utils

      # --- Start the server in the background --------------------------------
      - name: Start Express server (triggers NeMo install)
        run: |
          mkdir -p ci-logs
          # Run detached; capture PID + logs for later steps.
          npm run dev:server > ci-logs/server.log 2>&1 &
          echo $! > ci-logs/server.pid
          echo "Server PID: $(cat ci-logs/server.pid)"

      # --- Wait for /api/health --------------------------------------------
      - name: Wait for server to be ready
        run: |
          for i in $(seq 1 120); do
            if curl -fsS http://localhost:3000/api/health > /dev/null 2>&1; then
              echo "Server is up after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "Server did not become ready in 120s"
          cat ci-logs/server.log || true
          exit 1

      # --- Wait for the NeMo install to finish ------------------------------
      # The sanity check runs *after* getNemo() resolves, so poll until
      # nemo.pass is true or a hard timeout is hit.
      - name: Wait for NeMo install
        run: |
          for i in $(seq 1 600); do    # up to 10 min
            body=$(curl -fsS "http://localhost:3000/api/sanity_check?refresh=1" || true)
            echo "[$i] $body"
            if echo "$body" | grep -q '"nemo":{"pass":true'; then
              echo "NeMo is installed and detected."
              exit 0
            fi
            sleep 1
          done
          echo "NeMo did not become available in time."
          tail -n 200 ci-logs/server.log || true
          exit 1

      # --- Assert the shape of the result -----------------------------------
      - name: Assert sanity_check fields
        run: |
          body=$(curl -fsS "http://localhost:3000/api/sanity_check")
          echo "$body" | tee ci-logs/sanity_check.json
          node -e '
            const r = require("./ci-logs/sanity_check.json");
            if (!r.nemo?.pass)   throw new Error("nemo.pass was not true");
            if (!r.nemo.version) throw new Error("nemo.version missing");
            // model / server are allowed to be false on CI; only warn.
            if (!r.model?.pass)  console.warn("model not present:", r.model);
            if (!r.server?.pass) console.warn("stt server not up:", r.server);
            console.log("sanity_check OK:", r);
          '

      # --- Manual CLI smoke test (like your PowerShell snippet) --------------
      - name: Verify nemo-speech CLI directly
        run: |
          ls -al vendor/NeMoSpeech/bin || true
          export PATH="$PWD/vendor/NeMoSpeech/bin:$PATH"
          nemo-speech --version

      # --- Always clean up ---------------------------------------------------
      - name: Stop server
        if: always()
        run: |
          if [ -f ci-logs/server.pid ]; then
            kill "$(cat ci-logs/server.pid)" 2>/dev/null || true
          fi

      - name: Upload server logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: server-logs
          path: ci-logs/
          if-no-files-found: warn
